name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-tests:
    name: CPU tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      PYTHONIOENCODING: utf-8
      MPLBACKEND: Agg
      AGBENCH_NO_KEEP_AWAKE: "1"   # no sleep inhibitor on CI runners
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tag (no "v10"), so the exact release is pinned.
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Install (CPU PyTorch)
        run: uv sync --locked --extra cpu
      - name: Show the scenario plan
        run: uv run --no-sync python -m agbench list --suite full
      - name: Tests
        run: uv run --no-sync pytest -q
